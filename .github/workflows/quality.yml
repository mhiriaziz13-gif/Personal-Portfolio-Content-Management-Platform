name: Portfolio quality and security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run test:integration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_AAL1_ACCESS_TOKEN: ${{ secrets.TEST_SUPABASE_AAL1_ACCESS_TOKEN }}
          TEST_PUBLISHED_PROJECT_ID: ${{ secrets.TEST_PUBLISHED_PROJECT_ID }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          ALLOW_TEST_DATABASE_MUTATIONS: "true"
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ahmedaziz-portfolio.vercel.app
          APP_URL: https://ahmedaziz-portfolio.vercel.app

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_USE_FIXTURES: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      VERCEL_ENV: production
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and start the production fixture
        shell: bash
        run: |
          npm run build
          npm run start > "$RUNNER_TEMP/portfolio-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/portfolio-server.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/portfolio-server.log"
          exit 1
      - run: npm run audit:seo
      - run: npm run audit:security
        env:
          SECURITY_TARGET_URL: http://127.0.0.1:3000
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/portfolio-server.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the fixture server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/portfolio-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/portfolio-server.pid")" || true
          fi
